# Blueprint de Render (plan gratuito); asume que la raíz del repo es app/. Las variables con sync:false se
# piden/rellenan en el panel de Render; NUNCA pongas valores reales aquí.
services:
  - type: web
    name: panaderia-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    # Aplica migraciones (idempotentes) y arranca. El plan free no tiene preDeployCommand.
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LOW_MARGIN_THRESHOLD_PERCENT
        value: "20"
      # El seed corre solo al arrancar (idempotente) si estas 3 existen; pégalas en el panel.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_OPERARIO_PASSWORD
        sync: false
      - key: SEED_DUENO_PASSWORD
        sync: false
