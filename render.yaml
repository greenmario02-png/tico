# Blueprint de Render (plan gratuito); asume que la raíz del repo es app/. Las variables con sync:false se
# piden/rellenan en el panel de Render; NUNCA pongas valores reales aquí.
services:
  - type: web
    name: panaderia-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    # Aplica migraciones (idempotentes) y arranca. El plan free no tiene preDeployCommand.
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LOW_MARGIN_THRESHOLD_PERCENT
        value: "20"
      - key: TRUST_PROXY
        value: "true"
      - key: LOGIN_THROTTLE_BASE_SECONDS
        value: "5"
      - key: LOGIN_THROTTLE_MAX_SECONDS
        value: "900"
      - key: LOGIN_IP_LIMIT_PER_MINUTE
        value: "20"
      - key: EXCHANGE_RATE_TTL_MINUTES
        value: "5"
      # El seed ya se cargó. Para volver a sembrar pon RUN_SEED=true (y las 3 contraseñas) y quítalo después:
      # sembrar en cada arranque retrasa la apertura del puerto y Render lo da por fallido.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_OPERARIO_PASSWORD
        sync: false
      - key: SEED_DUENO_PASSWORD
        sync: false
