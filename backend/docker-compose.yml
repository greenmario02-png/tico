services:
  postgres:
    image: postgres:16-alpine
    container_name: panaderia_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: panaderia
      POSTGRES_PASSWORD: panaderia
      POSTGRES_DB: panaderia_dev
    ports:
      - "5432:5432"
    volumes:
      - panaderia_pgdata:/var/lib/postgresql/data

volumes:
  panaderia_pgdata:
